name: Archivio e taratura

# Ogni notte mette da parte la previsione emessa, la confronta con le misure
# dei giorni ormai chiusi, e ricalcola la taratura della pioggia su novantadue
# giorni, che e la finestra che il browser non puo permettersi a ogni apertura.

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archivio
  cancel-in-progress: false

jobs:
  archivia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aggiorna archivio e tarature
        run: node strumenti/archivia.js

      - name: Salva i risultati
        run: |
          git config user.name "archivio PedrengoMeteo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati
          if git diff --staged --quiet; then
            echo "nessuna novita da salvare"
          else
            git commit -m "Archivio del $(date -u +%Y-%m-%d)"
            git push
          fi
